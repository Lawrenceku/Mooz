name: Feature Request
description: Got an idea for something Mooz should do? Share it here.
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome! Mooz is intentionally kept lean, so not every idea will make the cut — but all suggestions are read and considered.
        Check the [open issues](https://github.com/Lawrenceku/Mooz/issues) first to see if someone's already brought this up.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or limitation you're running into. "I want X" is less useful than "I'm trying to do Y and I can't because Z".
      placeholder: "e.g. When there are more than 4 people in a call, bandwidth usage spikes and the call becomes unusable."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Doesn't have to be fully designed — a rough idea is fine.
      placeholder: "e.g. Integrate an SFU like mediasoup so that each client only sends one video stream regardless of participant count."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
      description: Have you thought about other ways to solve this? Any tradeoffs worth noting?

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Video / Audio
        - Screen sharing
        - Chat
        - Signaling / WebRTC
        - UI / UX
        - Performance
        - Security / Auth
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched the open issues and this hasn't been requested yet.
          required: true
