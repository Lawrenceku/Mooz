name: Issue Assignment — .take

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign-issue:
    # Only run on issue comments (not PR comments), and only when the comment is exactly ".take"
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.body == '.take'

    runs-on: ubuntu-latest

    steps:
      - name: Check if issue is already assigned
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const assignees = issue.data.assignees.map(a => a.login);
            const commenter = context.actor;

            if (assignees.length > 0 && !assignees.includes(commenter)) {
              // Already assigned to someone else
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Hey @${commenter} — this issue is already assigned to ${assignees.map(a => '@' + a).join(', ')}. If you think it's stale, leave a comment and a maintainer can reassign it.`,
              });
              core.setOutput('should_assign', 'false');
            } else if (assignees.includes(commenter)) {
              // Already assigned to themselves
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `@${commenter} You're already assigned to this issue. Good luck! 🚀`,
              });
              core.setOutput('should_assign', 'false');
            } else {
              core.setOutput('should_assign', 'true');
            }

      - name: Assign the commenter
        if: steps.check.outputs.should_assign == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commenter = context.actor;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [commenter],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Assigned to @${commenter}! 🎉\n\nWhen you're ready, fork the repo, branch off \`dev\`, and open a PR when done. See [CONTRIBUTION.md](../blob/main/CONTRIBUTION.md) if you need a hand getting set up.`,
            });
